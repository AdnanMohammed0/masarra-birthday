<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6e0404">
<title>Happy Birthday مسرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6e0404; --maroon-2:#8c1212; --wine:#7a2027; --pink:#fbcfe3; --pink-2:#f4a9c4;
  --cream:#fde4d6; --lav:#b8a9cf; --text-dark:#5a0f14;
  --script:'Great Vibes',cursive; --serif:'Playfair Display',serif; --ar:'Aref Ruqaa',serif; --ar2:'Cairo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--maroon);font-family:var(--ar2);color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
img{display:block}

/* ---------- NAV ---------- */
nav{position:fixed;top:0;left:0;right:0;height:46px;background:var(--maroon);z-index:50;display:flex;justify-content:flex-end;align-items:center;gap:4px;padding:0 14px;
  box-shadow:0 2px 12px rgba(0,0,0,.25);transform:translateY(-100%);transition:transform .6s ease}
nav.show{transform:none}
nav button{font-family:var(--serif);font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;padding:8px 9px;border-radius:6px;transition:.25s}
nav button:hover{opacity:1;background:rgba(255,255,255,.08)}
nav button.on{opacity:1;font-weight:700}
nav .brand{margin-right:auto;font-family:var(--ar);font-size:19px;opacity:1;text-transform:none;letter-spacing:0}
nav i,nav em{display:none;font-style:normal}
nav b{font-weight:inherit}
@media (max-width:640px){
  nav{top:auto;bottom:0;height:auto;justify-content:space-around;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    transform:translateY(110%);box-shadow:0 -4px 18px rgba(0,0,0,.3);border-radius:18px 18px 0 0}
  nav button{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-height:52px;justify-content:center;padding:4px 2px;border-radius:12px;text-transform:none;letter-spacing:0}
  nav button.on{background:rgba(255,255,255,.13)}
  nav i{display:block;font-size:21px;line-height:1}
  nav em{display:block;font-family:var(--ar2);font-size:11px;font-weight:600}
  nav b,nav .brand,nav .nav-letter{display:none!important}
}

/* ---------- SCREENS ---------- */
.screen{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s;overflow-y:auto;overflow-x:hidden}
.screen.active{opacity:1;visibility:visible}
.pad{padding:70px 16px 40px;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gingham-lav{background-color:#bcaed1;
  background-image:repeating-linear-gradient(0deg,rgba(110,90,150,.38) 0 44px,transparent 44px 88px),
  repeating-linear-gradient(90deg,rgba(110,90,150,.38) 0 44px,transparent 44px 88px),
  repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 5px)}
.back{width:48px;height:48px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;margin-top:26px;transition:.3s;flex:none}
.back:hover{transform:scale(1.1) rotate(-8deg);background:rgba(255,255,255,.1)}
.back svg{width:22px;height:22px}

/* ---------- INTRO (roses) ---------- */
#intro{background:radial-gradient(ellipse at 50% 35%,#8d0f1c 0%,#4a0209 55%,#220005 100%);z-index:40}
#garden{position:absolute;inset:0;width:100%;height:100%}
#garden .stem{fill:none;stroke:#2f6b2a;stroke-width:5;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:grow 1.8s ease-out forwards;animation-delay:var(--d)}
#garden .leaf{fill:#3f8a36;transform-box:fill-box;transform-origin:0% 50%;transform:scale(0);animation:pop .8s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--d)}
#garden .bloom{transform:scale(0) rotate(-120deg);animation:bloom 1.4s cubic-bezier(.25,1.4,.5,1) forwards;animation-delay:var(--d)}
#garden .sway{animation:sway 5s ease-in-out infinite alternate;animation-delay:var(--sd);transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes bloom{to{transform:scale(1) rotate(0)}}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.intro-card{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;opacity:0;animation:fadeUp 1.4s ease forwards 2.6s;width:min(92vw,560px)}
.intro-card small{font-family:var(--script);font-size:clamp(30px,6vw,48px);display:block;color:#ffd9e6;text-shadow:0 0 18px rgba(255,120,160,.6)}
.intro-card h1{font-family:var(--ar);font-size:clamp(84px,20vw,170px);line-height:1.05;color:#fff;
  text-shadow:0 0 12px #ff8fb1,0 0 38px #ff3d77,0 6px 24px rgba(0,0,0,.5);animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{to{text-shadow:0 0 18px #ffc1d4,0 0 60px #ff3d77,0 6px 24px rgba(0,0,0,.5)}}
.open-btn{margin-top:18px;padding:13px 30px;border-radius:40px;background:linear-gradient(135deg,#ff7aa2,#d6124e);font-family:var(--ar2);font-weight:700;font-size:18px;
  box-shadow:0 8px 30px rgba(255,60,110,.5),inset 0 1px 0 rgba(255,255,255,.4);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 10px 44px rgba(255,60,110,.8)}}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,-40%)}to{opacity:1;transform:translate(-50%,-50%)}}
#intro.leaving #garden{transition:transform 1.2s ease,opacity 1.2s;transform:scale(1.25);opacity:0}
#intro.leaving .intro-card{transition:opacity .6s;opacity:0!important}

/* ---------- HERO ---------- */
#hero{background:var(--pink)}
#hero .pad{position:relative}
.hero-title{font-family:var(--serif);color:var(--maroon);font-size:clamp(30px,6vw,52px);text-align:center;margin-bottom:8px}
.hero-title span{display:block;font-family:var(--ar);font-size:1.25em;line-height:1.1;color:#a0102b}
#hero.active .hero-title{animation:drop 1s ease both .9s}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
.hearts{position:absolute;left:6%;top:24%;width:clamp(90px,15vw,170px);animation:floaty 4s ease-in-out infinite}
.balloons{position:absolute;right:5%;bottom:-10px;width:clamp(110px,17vw,200px);animation:floaty 5s ease-in-out infinite reverse}
@keyframes floaty{50%{transform:translateY(-14px)}}
.envelope{position:relative;width:min(340px,78vw);aspect-ratio:1.5;margin-top:10px;perspective:900px;cursor:pointer}
.env-body{position:absolute;inset:0;background:linear-gradient(160deg,#c3131b,#8a0306);border-radius:4px;box-shadow:0 18px 40px rgba(110,0,20,.35)}
.env-body::before{content:"";position:absolute;inset:0;background:linear-gradient(20deg,#a00a10,#7a0205);clip-path:polygon(0 100%,50% 48%,100% 100%)}
.env-body::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.12),transparent 30%,transparent 70%,rgba(0,0,0,.12));clip-path:polygon(0 0,50% 55%,0 100%,100% 100%,50% 55%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(180deg,#b20d14,#8c0309);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:2;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.seal{position:absolute;left:50%;top:58%;width:26%;transform:translate(-50%,-50%);z-index:3;transition:transform .4s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.envelope:hover .seal{transform:translate(-50%,-50%) scale(1.08) rotate(8deg)}
#hero.active .env-body,#hero.active .env-flap{animation:envIn 1s cubic-bezier(.3,1.4,.5,1) both .35s}
#hero.active .seal{animation:sealIn .7s ease both}
@keyframes envIn{from{transform:scale(.15);opacity:0}}
@keyframes sealIn{from{transform:translate(-50%,-50%) scale(0) rotate(-90deg)}}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
.envelope.open .seal{transform:translate(-50%,-50%) scale(0) rotate(90deg)!important;transition:transform .4s}
.hint{font-family:var(--ar2);color:var(--maroon);margin-top:16px;font-size:15px;opacity:.75;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* ---------- CHOOSE ---------- */
#choose{background:var(--maroon)}
.script-title{font-family:var(--script);font-size:clamp(46px,8vw,86px);font-weight:400;text-align:center;line-height:1.1}
#choose.active .script-title{animation:drop 1s ease both .2s}
.choices{display:flex;gap:clamp(18px,6vw,90px);margin-top:36px;flex-wrap:wrap;justify-content:center}
.choice{display:flex;flex-direction:column;align-items:center;gap:14px;width:clamp(130px,22vw,210px)}
.choice svg{width:100%;height:clamp(130px,20vw,200px);transition:transform .4s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 10px 14px rgba(0,0,0,.3))}
.choice:hover svg{transform:translateY(-10px) scale(1.07) rotate(-3deg)}
.choice span{font-family:var(--serif);font-weight:700;font-size:clamp(16px,2.2vw,22px);letter-spacing:.05em}
.choice .lbl{display:flex;flex-direction:column;align-items:center;gap:4px}
.choice small{font-family:var(--ar2);font-size:13px;opacity:.7}
#choose.active .choice{animation:popIn .8s cubic-bezier(.3,1.5,.5,1) both}
#choose.active .choice:nth-child(1){animation-delay:.6s}#choose.active .choice:nth-child(2){animation-delay:.8s}#choose.active .choice:nth-child(3){animation-delay:1s}
@keyframes popIn{from{opacity:0;transform:translateY(40px) scale(.7)}}

/* ---------- MESSAGE (envelope) ---------- */
.letter-env{position:relative;width:min(440px,90vw);height:min(420px,95vw);margin-top:20px;cursor:pointer}
.le-back{position:absolute;left:0;right:0;bottom:0;height:62%;background:#5b1017;border-radius:6px}
.le-flap{position:absolute;left:0;right:0;bottom:62%;height:26%;background:linear-gradient(0deg,#5b1017,#6d1a22);clip-path:polygon(0 100%,50% 0,100% 100%);border-radius:6px}
.le-flap::after{content:"";position:absolute;inset:14px 34px 0;background:#f4ebe0;clip-path:polygon(0 100%,50% 0,100% 100%)}
.le-card{position:absolute;left:11%;right:11%;top:22%;height:66%;background:#fff;border-radius:3px;box-shadow:0 -4px 16px rgba(0,0,0,.2);padding:18px 16px;color:var(--text-dark);text-align:center;overflow:hidden;transition:transform .5s}
.le-card h3{font-family:var(--ar);font-size:26px;font-weight:700;color:#8a1430}
.le-card p{font-family:var(--ar2);font-size:10.5px;line-height:1.7;margin-top:4px}
.le-front{position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(180deg,#7b1f28,#5e1219);clip-path:polygon(0 0,50% 42%,100% 0,100% 100%,0 100%);border-radius:0 0 6px 6px;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;filter:drop-shadow(0 -2px 3px rgba(0,0,0,.25))}
.le-front::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 35%,transparent 65%,rgba(0,0,0,.18));clip-path:polygon(0 0,50% 42%,0 100%,100% 100%,50% 42%,100% 0,100% 100%,0 100%)}
.le-front span{font-family:var(--serif);letter-spacing:.12em;font-size:13px;color:#f0dcd0;text-align:center;line-height:1.5;position:relative;z-index:1}
.letter-env:hover .le-card{transform:translateY(-14px)}
#message.active .le-card{animation:slideUp 1.2s cubic-bezier(.3,1.3,.5,1) both .5s}
#message.active .letter-env{animation:popIn .9s ease both .1s}
@keyframes slideUp{from{transform:translateY(60%)}}
#message .back,#cake .back{color:var(--maroon)}

/* ---------- LETTER ---------- */
#letter{background:var(--maroon)}
.paper-frame{width:min(760px,94vw);padding:clamp(18px,4vw,42px);position:relative;
  background-color:#fbe3e6;background-image:repeating-linear-gradient(0deg,rgba(236,130,150,.45) 0 16px,transparent 16px 32px),repeating-linear-gradient(90deg,rgba(236,130,150,.45) 0 16px,transparent 16px 32px);
  box-shadow:0 20px 50px rgba(0,0,0,.35)}
.paper{background:#fff;color:var(--text-dark);padding:clamp(26px,5vw,52px) clamp(18px,5vw,56px);box-shadow:6px 6px 16px rgba(0,0,0,.18);min-height:320px;text-align:center}
.paper h2{font-family:var(--ar);font-size:clamp(34px,6vw,52px);color:#8a1430;margin-bottom:14px}
.paper .txt{font-family:var(--ar2);font-size:clamp(16px,2.3vw,20px);line-height:2;white-space:pre-line;min-height:8em}
.paper .txt .caret{display:inline-block;width:2px;height:1.1em;background:#8a1430;vertical-align:middle;animation:blink .8s steps(1) infinite}
.paper .sign{font-family:var(--script);font-size:34px;color:#8a1430;margin-top:14px;opacity:0;transition:opacity 1s}
.paper .sign.show{opacity:1}
.bow{position:absolute;width:clamp(58px,10vw,96px);filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
.bow.tl{left:-14px;top:-18px;transform:rotate(-14deg)}
.bow.br{right:-10px;bottom:-16px;transform:rotate(12deg)}
#letter.active .paper-frame{animation:unfold 1s cubic-bezier(.3,1.3,.5,1) both}
@keyframes unfold{from{opacity:0;transform:scale(.4) rotate(-6deg)}}
#letter .back{color:#fff}

/* ---------- FLOWERS ---------- */
#flowers{background:var(--maroon)}
.flower-stage{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,3vw,40px);align-items:center;width:min(980px,100%)}
.notes{display:flex;flex-direction:column;gap:22px}
.notes.l{align-items:flex-end}.notes.r{align-items:flex-start}
.note{position:relative;background:#f9dbe9;color:var(--text-dark);padding:16px 18px;border-radius:12px;font-family:var(--ar2);font-weight:600;font-size:clamp(13px,1.8vw,16px);width:clamp(140px,19vw,200px);text-align:center;
  box-shadow:4px 5px 0 #c7a9d8,0 10px 20px rgba(0,0,0,.25);transition:transform .35s}
.note:nth-child(2){background:#e8dff5}
.note::before{content:"🌸";position:absolute;left:-10px;top:-12px;font-size:20px}
.note:hover{transform:rotate(-3deg) scale(1.06)}
#flowers.active .note{animation:popIn .8s cubic-bezier(.3,1.5,.5,1) both}
#flowers.active .notes.l .note:nth-child(1){animation-delay:1.6s}#flowers.active .notes.r .note:nth-child(1){animation-delay:1.9s}
#flowers.active .notes.l .note:nth-child(2){animation-delay:2.2s}#flowers.active .notes.r .note:nth-child(2){animation-delay:2.5s}
#bouquetSvg{width:clamp(220px,32vw,340px);cursor:pointer;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
#bouquetSvg .fl{transform-box:fill-box;transform-origin:50% 90%}
#flowers.active #bouquetSvg .fl{animation:flBloom 1s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
#flowers.active #bouquetSvg .wrap{animation:popIn .8s ease both}
@keyframes flBloom{from{transform:scale(0) rotate(-40deg)}}
#bouquetSvg:hover .fl{animation:wiggle .6s ease}
@keyframes wiggle{30%{transform:rotate(-6deg)}70%{transform:rotate(5deg)}}
.caption{font-family:var(--script);font-size:clamp(32px,5vw,48px);margin-top:18px;text-align:center}
#flowers.active .caption{animation:drop 1s ease both 2.8s}
@media (max-width:700px){.flower-stage{grid-template-columns:1fr 1fr}.flower-stage #bouquetSvg{grid-column:1/-1;grid-row:1;justify-self:center}.notes.l,.notes.r{align-items:center}}

/* ---------- CAKE ---------- */
#cake .script-title{color:#8a1430;text-shadow:2px 2px 0 rgba(255,255,255,.35)}
#cake .script-title span{font-family:var(--ar);font-size:.8em;margin-inline-start:.2em}
#cake.active .script-title{animation:drop 1s ease both .2s}
.cake-stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(8px,2vw,30px);width:min(1100px,100%);margin-top:6px}
.cake-wrap{position:relative;width:min(420px,86vw);aspect-ratio:1}
.cake-wrap>svg{width:100%;height:100%}
.cake-photo{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;object-fit:cover;border:5px solid #fff4f6;box-shadow:0 0 0 3px #f2a7bd,0 4px 10px rgba(0,0,0,.25)}
#cake.active .cake-wrap{animation:popIn 1s cubic-bezier(.3,1.4,.5,1) both .3s}
.candles{position:absolute;inset:0;pointer-events:none}
.candle::before{content:"";position:absolute;inset:-18px -12px -6px}
.candle{position:absolute;width:2.6%;height:8%;transform:translate(-50%,-100%);border-radius:3px;pointer-events:auto;cursor:pointer;
  background:repeating-linear-gradient(160deg,#fff 0 5px,#ff7fa7 5px 9px);box-shadow:inset -2px 0 2px rgba(0,0,0,.15)}
.flame{position:absolute;left:50%;bottom:100%;width:180%;height:70%;transform:translateX(-50%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 75%,#fff 0 20%,#ffe066 35%,#ff9a1f 65%,rgba(255,80,0,0) 72%);animation:flick .15s ease-in-out infinite alternate;transform-origin:50% 100%;
  box-shadow:0 0 16px 6px rgba(255,190,70,.55)}
@keyframes flick{from{transform:translateX(-50%) scaleY(1) rotate(-3deg)}to{transform:translateX(-50%) scaleY(1.12) rotate(3deg)}}
.candle.out .flame{animation:none;opacity:0;transform:translateX(-50%) scale(.2);transition:.4s}
.smoke{position:absolute;left:50%;bottom:100%;width:8px;height:8px;border-radius:50%;background:rgba(200,200,200,.7);animation:smoke 1.6s ease-out forwards}
@keyframes smoke{to{transform:translate(-50%,-60px) scale(4);opacity:0}}
.cake-hint{font-family:var(--ar2);color:var(--maroon);font-weight:700;text-align:center;margin-top:8px;font-size:15px;background:rgba(255,255,255,.55);padding:6px 16px;border-radius:30px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.mic-btn{background:var(--maroon);color:#fff;padding:5px 14px;border-radius:20px;font-size:14px}
.deco{position:relative;height:min(460px,60vh);min-width:200px}
.strip{position:absolute;left:8%;top:2%;width:46%;background:#111;padding:10px 10px 30px;transform:rotate(-7deg);box-shadow:0 10px 20px rgba(0,0,0,.35)}
.strip img{width:100%;aspect-ratio:1.1;object-fit:cover;border-radius:50%/44%;margin-bottom:10px;filter:grayscale(.2) contrast(1.05)}
.strip .bow{left:-24%;top:-8%;width:58%}
.camera{position:absolute;left:18%;bottom:0;width:62%;aspect-ratio:1.6;background:linear-gradient(160deg,#c4234a,#7d0a26);border-radius:12px;transform:rotate(-4deg);box-shadow:0 12px 20px rgba(0,0,0,.35);padding:9% 8%}
.camera img{width:62%;height:100%;object-fit:cover;border-radius:4px;border:3px solid #1b1b1b}
.camera::after{content:"";position:absolute;right:8%;top:30%;width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#333 0 30%,#777 34%,#222 45%,#555 60%,#2a2a2a 70%)}
.camera::before{content:"";position:absolute;right:12%;top:-7%;width:18%;height:10%;background:#6b0820;border-radius:4px 4px 0 0}
.vinyl{position:absolute;right:4%;top:0;width:78%;cursor:pointer;filter:drop-shadow(0 10px 16px rgba(0,0,0,.35))}
.vinyl .disc{transform-box:fill-box;transform-origin:center}
.vinyl.spin .disc{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.polaroid{position:absolute;background:#fff;padding:7px 7px 24px;box-shadow:0 8px 16px rgba(0,0,0,.3);width:38%}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover}
.polaroid.p1{left:14%;bottom:6%;transform:rotate(-8deg);background:#8a0f22}
.polaroid.p2{left:46%;bottom:0;transform:rotate(6deg);background:#ffe3ec}
#cake.active .deco.l>*{animation:slideL .9s cubic-bezier(.3,1.3,.5,1) both}
#cake.active .deco.r>*{animation:slideR .9s cubic-bezier(.3,1.3,.5,1) both}
#cake.active .deco>*:nth-child(2){animation-delay:.25s!important}#cake.active .deco>*:nth-child(3){animation-delay:.4s!important}
#cake.active .deco>*:nth-child(1){animation-delay:.6s}
@keyframes slideL{from{opacity:0;translate:-80px 0}}
@keyframes slideR{from{opacity:0;translate:80px 0}}
@media (max-width:900px){
  .cake-stage{grid-template-columns:1fr 1fr}
  .cake-stage .cake-wrap{grid-column:1/-1;grid-row:1;justify-self:center}
  .deco{height:300px;min-width:0}
}

/* ---------- WISH OVERLAY ---------- */
#wish{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity 1s;background:radial-gradient(circle,rgba(40,0,10,.55),rgba(20,0,5,.8))}
#wish.show{opacity:1;pointer-events:auto}
#wish div{text-align:center;padding:20px}
#wish h2{font-family:var(--ar);font-size:clamp(46px,10vw,96px);text-shadow:0 0 30px #ff4f86}
#wish p{font-family:var(--ar2);font-size:clamp(17px,3vw,24px);margin-top:10px;line-height:1.9}
#wish button{margin-top:22px;padding:10px 26px;border-radius:30px;background:#fff;color:var(--maroon);font-weight:700}

/* ---------- FX / MUSIC ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:45}
#wish.show ~ #fx{z-index:61}
.tap-heart{position:fixed;pointer-events:none;z-index:70;font-size:22px;animation:tapHeart 1.1s ease-out forwards}
@keyframes tapHeart{to{transform:translate(var(--x),-90px) scale(1.4) rotate(var(--r));opacity:0}}
#musicBtn{position:fixed;left:14px;bottom:14px;z-index:55;width:46px;height:46px;border-radius:50%;background:rgba(110,4,4,.9);display:none;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);border:2px solid #f7c3d3}
#musicBtn.show{display:grid}
#musicBtn .bars{display:flex;gap:3px;align-items:flex-end;height:18px}
#musicBtn .bars i{width:3px;background:#fff;border-radius:2px;height:30%;animation:eq .8s ease-in-out infinite alternate}
#musicBtn .bars i:nth-child(2){animation-delay:.2s}#musicBtn .bars i:nth-child(3){animation-delay:.4s}#musicBtn .bars i:nth-child(4){animation-delay:.1s}
#musicBtn.off .bars i{animation:none;height:20%}
@keyframes eq{to{height:100%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* =========================================================
   📱 PHONE LAYOUT
   ========================================================= */
@media (max-width:640px){
  .pad{padding:22px 16px calc(96px + env(safe-area-inset-bottom));min-height:100%}
  .back{width:52px;height:52px;margin-top:22px}
  #musicBtn{left:12px;bottom:calc(80px + env(safe-area-inset-bottom));width:44px;height:44px}

  /* intro */
  .intro-card{top:40%}
  .open-btn{min-height:52px;padding:14px 34px;font-size:19px}

  /* hero */
  .hearts{left:10px;top:18px;width:74px}
  .balloons{right:8px;top:10px;bottom:auto;width:78px}
  .hero-title{font-size:36px;margin-top:40px}
  .envelope{width:84vw;margin-top:18px}
  .seal{width:30%}
  .hint{font-size:16px;margin-top:20px}

  /* choose: tappable cards */
  #choose .script-title{font-size:46px}
  .choices{flex-direction:column;gap:14px;margin-top:22px;width:100%;max-width:420px}
  .choice{flex-direction:row;width:100%;gap:16px;padding:10px 18px 10px 12px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);text-align:start}
  .choice svg{width:92px;height:88px;flex:none}
  .choice .lbl{align-items:flex-start;flex:1}
  .choice span{font-size:19px}
  .choice small{font-size:14px}
  .choice::after{content:"›";font-size:34px;opacity:.6;line-height:1}
  .choice:active{background:rgba(255,255,255,.15);transform:scale(.98)}
  .choice:hover svg{transform:none}

  /* message */
  .letter-env{width:90vw;height:104vw;margin-top:6px}
  .le-card{padding:14px 12px}
  .le-card h3{font-size:22px}
  .le-card p{font-size:9.5px}
  .le-front span{font-size:14px}

  /* letter */
  .paper-frame{padding:14px;width:100%}
  .paper{padding:34px 18px 26px;min-height:0}
  .paper h2{font-size:36px;margin-bottom:8px}
  .paper .txt{font-size:17px;line-height:2;min-height:19em}
  #letter .pad{justify-content:flex-start;padding-top:34px}
  .paper .sign{font-size:30px}
  .bow{width:62px}
  .bow.tl{left:-8px;top:-14px}.bow.br{right:-6px;bottom:-12px}

  /* flowers */
  .flower-stage{grid-template-columns:1fr 1fr;gap:12px}
  .flower-stage #bouquetSvg{width:68vw;max-width:280px}
  .notes{gap:12px}
  .note{width:100%;font-size:14px;padding:16px 10px}
  .caption{font-size:36px;margin-top:14px}

  /* cake */
  #cake .script-title{font-size:48px}
  #cake .script-title .nm{display:block;font-size:.85em;margin:0}
  .cake-wrap{width:90vw}
  .cake-stage{gap:6px;margin-top:4px}
  .deco{height:250px}
  .strip{width:52%;left:4%}
  .camera{width:70%;left:14%}
  .vinyl{width:88%;right:0}
  .polaroid{width:44%;padding:5px 5px 18px}
  .polaroid.p1{left:4%}.polaroid.p2{left:48%}
  .cake-hint{flex-direction:column;gap:10px;padding:12px 16px;border-radius:18px;margin-top:14px;font-size:15px;width:100%;max-width:420px}
  .mic-btn{min-height:44px;padding:10px 22px;font-size:16px;width:100%}

  /* wish */
  #wish button{min-height:48px;padding:12px 34px;font-size:18px}
}
@media (max-width:640px) and (max-height:620px){
  .hero-title{margin-top:10px}
  .envelope{width:70vw}
}

<script>
/* =========================================================

const CONFIG = {
  name: 'مسرة',

  },
  letterTitle: 'حبيبتي مسرة،',

`اليوم عيدج، بس آني اللي أخذت أحلى هدية… لأنج بحياتي.
كل ضحكة منج تنوّر أيامي، وكل لحظة وياج تصير ذكرى ما تنتسى.
أتمنى هالسنة الجديدة تجيبلج فرح، وذكريات حلوة، وكل الحب اللي تستاهليه.

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const rand = (a,b) => a + Math.random()*(b-a);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs={}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };

/* ---------- photos with pretty placeholders ---------- */
function placeholder(label){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd1e0"/><stop offset="1" stop-color="#f08bab"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><path d="M100,78 C90,56 56,60 62,90 C66,110 92,124 100,138 C108,124 134,110 138,90 C144,60 110,56 100,78Z" fill="#fff" opacity=".85"/><text x="100" y="172" font-family="sans-serif" font-size="16" fill="#8a1430" text-anchor="middle">${label}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
$$('img[data-photo]').forEach(img => {
  const key = img.dataset.photo;
  img.onerror = () => { img.onerror = null; img.src = placeholder(key + '.jpg'); };

/* ---------- fill texts ---------- */
$('#miniTitle').textContent = CONFIG.letterTitle;
$('#miniText').textContent = CONFIG.letter;
$('#letterTitle').textContent = CONFIG.letterTitle;
$('#letterSign').textContent = CONFIG.signature;
$$('.note').forEach((n,i) => {

/* ---------- wax seal ---------- */
(function(){
  const s = $('#seal'); let d = '';
  for (let i=0;i<=72;i++){ const a=i/72*Math.PI*2, r=44+Math.sin(a*9)*2.5+Math.sin(a*23)*1.2; d += (i?'L':'M')+(Math.cos(a)*r).toFixed(1)+','+(Math.sin(a)*r).toFixed(1); }
  el('path',{d:d+'Z',fill:'#6d0f14'},s);
  el('circle',{r:31,fill:'#5a0a0f'},s);
  el('circle',{r:31,fill:'none',stroke:'#8e222a','stroke-width':2.5},s);
  el('path',{d:'M0,-6 C-4,-15 -18,-13 -16,0 C-14,8 -4,13 0,19 C4,13 14,8 16,0 C18,-13 4,-15 0,-6Z',fill:'#7e1a21',stroke:'#3e0508','stroke-width':1.5},s);
  el('path',{d:'M-30,-18 C-20,-34 10,-40 26,-26',fill:'none',stroke:'rgba(255,255,255,.18)','stroke-width':4,'stroke-linecap':'round'},s);
})();

/* ---------- rose garden intro ---------- */
(function(){
  const g = $('#garden');
  const defs = el('defs',{},g);
  const N = window.innerWidth < 640 ? 9 : 14;
  const palettes = [['#b3072f','#ff4f7a'],['#d6124e','#ff9ab6'],['#8e0020','#e0324f'],['#e8577a','#ffc5d3'],['#c2185b','#ff80ab']];
  for (let i=0;i<N;i++){
    const x = 40 + (920/(N-1))*i + rand(-20,20);
    const top = rand(150, 380) + (Math.abs(i-(N-1)/2) < 2 ? 120 : 0);
    const bx = x + rand(-50,50);
    const d0 = i*0.09 + rand(0,.25);
    const grp = el('g',{class:'sway',style:`--sd:${rand(0,3).toFixed(2)}s`},g);
    const path = el('path',{class:'stem',d:`M${bx},620 Q${(bx+x)/2+rand(-60,60)},${(620+top)/2} ${x},${top}`,style:`--d:${d0}s`},grp);
    const len = path.getTotalLength(); path.style.setProperty('--len', len);
    for (let k=0;k<2;k++){
      const p = path.getPointAtLength(len*(0.45+k*0.2));
      const side = k%2 ? 1 : -1;
      el('ellipse',{class:'leaf',cx:p.x+side*16,cy:p.y,rx:18,ry:7,transform:`rotate(${side*-30} ${p.x+side*16} ${p.y})`,style:`--d:${d0+0.8+k*0.2}s`},grp);
    }
    const [c1,c2] = palettes[i%palettes.length];
    const s = rand(.75,1.15);
    const pos = el('g',{transform:`translate(${x} ${top})`},grp);
    const b = el('g',{class:'bloom',style:`--d:${d0+1.4}s`},pos);
    el('use',{href:'#rose',x:-40*s,y:-40*s,width:80*s,height:80*s,style:`--r1:${c1};--r2:${c2}`},b);
  }
})();

/* ---------- cake svg ---------- */
(function(){
  const s = $('#cakeSvg');
  el('rect',{x:70,y:70,width:260,height:260,fill:'#e0508a',transform:'rotate(45 200 200)'},s);
  const plate = el('g',{fill:'url(#ging)'},s);

  el('rect',{x:a,y:a,width:b-a,height:b-a},plate);

  el('rect',{x:a,y:a,width:b-a,height:b-a,fill:'none',stroke:'rgba(150,0,30,.25)','stroke-width':1},s);
  el('circle',{cx:200,cy:206,r:136,fill:'rgba(0,0,0,.18)'},s);
  el('circle',{cx:200,cy:200,r:136,fill:'#e7ad73'},s);
  el('circle',{cx:200,cy:200,r:124,fill:'#f7c3cf'},s);
  el('circle',{cx:200,cy:200,r:124,fill:'none',stroke:'#fbd9e1','stroke-width':6},s);
  for (let i=0;i<10;i++){
    const ang = i/10*Math.PI*2 + Math.PI/10, cx = 200+Math.cos(ang)*98, cy = 200+Math.sin(ang)*98;
    el('circle',{cx,cy:cy+3,r:17,fill:'rgba(180,90,110,.25)'},s);
    el('circle',{cx,cy,r:17,fill:'#fff'},s);
    el('path',{d:`M${cx-10},${cy} q10,-12 20,0 q-10,10 -20,0`,fill:'none',stroke:'#f2dfe4','stroke-width':2},s);
    el('circle',{cx:cx+1,cy:cy-2,r:10,fill:'#c8102e'},s);
    el('circle',{cx:cx-2,cy:cy-5,r:3,fill:'#fff',opacity:.75},s);
  }
  // candles on an arc
  const box = $('#candles');
  const n = 7;
  for (let i=0;i<n;i++){
    const ang = Math.PI*(1.12 + i/(n-1)*0.76);
    const x = 50 + Math.cos(ang)*21.5, y = 50 + Math.sin(ang)*21.5 + 4;
    const c = document.createElement('div'); c.className='candle'; c.style.left=x+'%'; c.style.top=y+'%';
    c.innerHTML = '<div class="flame"></div>';
    c.addEventListener('click', e => { e.stopPropagation(); blowCandle(c); });
    box.appendChild(c);
  }
})();

/* =========================================================
   MUSIC: song file, or a synthesized music-box Happy Birthday
   ========================================================= */
const Synth = (() => {
  let ctx, out, timer, next = 0, idx = 0;
  const F = {G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,C3:130.81,G3:196,F3:174.61};
  const mel = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
               ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
               ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
               ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3],[null,2]];
  const bass = {0:'C3',6:'G3',12:'C3',15:'F3',19:'F3',21:'C3',23:'G3',24:'C3'};
  const beat = 0.52;
  function note(f, t, dur, vol){
    [[1,'sine',vol],[2,'sine',vol*.28],[3,'triangle',vol*.08]].forEach(([m,type,v])=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f*m;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+1.4);
      o.connect(g).connect(out); o.start(t); o.stop(t+dur+1.5);
    });
  }
  function tick(){
    while (next < ctx.currentTime + 0.25){
      const [n,d] = mel[idx];
      if (n) note(F[n], next, d*beat, .22);
      if (bass[idx]) note(F[bass[idx]], next, 2*beat, .12);
      next += d*beat; idx = (idx+1) % mel.length;
    }
  }
  return {
    play(){
      if (!ctx){
        ctx = new (window.AudioContext||window.webkitAudioContext)();
        out = ctx.createGain(); out.gain.value = .8;
        const dl = ctx.createDelay(); dl.delayTime.value = .31; const fb = ctx.createGain(); fb.gain.value = .28; const wet = ctx.createGain(); wet.gain.value = .3;
        out.connect(ctx.destination); out.connect(dl); dl.connect(fb).connect(dl); dl.connect(wet).connect(ctx.destination);
        next = ctx.currentTime + .1;
      }
      ctx.resume(); clearInterval(timer); next = Math.max(next, ctx.currentTime+.05); timer = setInterval(tick, 60);
      return ctx.state === 'running' || true;
    },
    pause(){ clearInterval(timer); ctx && ctx.suspend(); },
    running(){ return ctx && ctx.state === 'running'; }
  };
})();

const Music = {
  audio: new Audio(CONFIG.song), mode: 'file', playing: false, wanted: true,
  init(){
    this.audio.loop = true; this.audio.preload = 'auto';
    this.audio.addEventListener('error', () => { if (this.mode==='file'){ this.mode='synth'; if (this.wanted && this.playing) { this.playing=false; this.play(); } } });
  },
  async play(){
    this.wanted = true;
    if (this.mode === 'file'){
      try { await this.audio.play(); this.playing = true; }
      catch(e){ if (e.name !== 'NotAllowedError'){ this.mode = 'synth'; return this.play(); } this.playing = false; }
    } else {
      Synth.play(); this.playing = true;
    }
    this.ui();
  },
  pause(){ this.wanted = false; this.playing = false; this.mode==='file' ? this.audio.pause() : Synth.pause(); this.ui(); },
  toggle(){ this.playing ? this.pause() : this.play(); },
  ui(){ $('#musicBtn').classList.toggle('off', !this.playing); $('#vinyl').classList.toggle('spin', this.playing); }
};
Music.init();
Music.play(); // try autoplay immediately
const unlock = () => { if (Music.wanted && (!Music.playing || (Music.mode==='synth' && !Synth.running()))) Music.play(); };
['pointerdown','keydown','touchstart'].forEach(ev => document.addEventListener(ev, unlock, {passive:true}));
$('#musicBtn').addEventListener('click', e => { e.stopPropagation(); Music.toggle(); });
$('#vinyl').addEventListener('click', e => { e.stopPropagation(); Music.toggle(); burst(e.clientX, e.clientY, 18); });

/* =========================================================
   NAVIGATION
   ========================================================= */
let current = 'intro';
function go(id){
  if (id === current) return;
  $('#'+current).classList.remove('active');
  const next = $('#'+id); next.classList.add('active'); next.scrollTop = 0;
  current = id;
  const navId = (id === 'letter' && innerWidth <= 640) ? 'message' : id;
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.go === navId && !b.classList.contains('brand')));
  if (id === 'hero') $('#heroEnv').classList.remove('open');
  if (id === 'letter') typeLetter();
  if (id === 'cake') setTimeout(() => confetti(120), 600);
  if (id === 'flowers') setTimeout(() => petalShower(40), 900);
  fx.rate = (id === 'intro' ? .5 : .12) * (innerWidth <= 640 ? .55 : 1);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if (t && current !== 'intro') go(t.dataset.go);
});

$('#openBtn').addEventListener('click', e => {
  e.stopPropagation(); Music.play();
  $('#intro').classList.add('leaving'); petalShower(80);
  setTimeout(() => { go('hero'); $('#nav').classList.add('show'); $('#musicBtn').classList.add('show'); }, 900);
});

$('#heroEnv').addEventListener('click', () => {
  const env = $('#heroEnv'); if (env.classList.contains('open')) return;
  env.classList.add('open');
  const r = $('#seal').getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 26);
  setTimeout(() => go('choose'), 1000);
});

$('#bouquetSvg').innerHTML = $('#bouquet').innerHTML;
$('#bouquetSvg').addEventListener('click', e => petalShower(30, e.clientX, e.clientY));

/* ---------- typewriter letter ---------- */
let typeTimer;
function typeLetter(){
  clearTimeout(typeTimer);
  const box = $('#letterText'), sign = $('#letterSign'), txt = CONFIG.letter;
  box.textContent = ''; sign.classList.remove('show');
  const caret = document.createElement('span'); caret.className = 'caret';
  let i = 0;
  const step = () => {
    if (current !== 'letter') return;
    box.textContent = txt.slice(0, ++i); box.appendChild(caret);
    if (i < txt.length) typeTimer = setTimeout(step, txt[i-1] === '\n' ? 380 : 42);
    else { caret.remove(); sign.classList.add('show'); heartsRain(24); }
  };
  typeTimer = setTimeout(step, 900);
}

/* ---------- candles ---------- */
let wished = false;
function blowCandle(c){
  if (c.classList.contains('out')) return;
  c.classList.add('out');
  const sm = document.createElement('div'); sm.className = 'smoke'; c.appendChild(sm); setTimeout(()=>sm.remove(),1700);
  if ($$('.candle:not(.out)').length === 0 && !wished){
    wished = true; stopMic();
    setTimeout(() => { $('#wish').classList.add('show'); fireworks(9); confetti(160); }, 700);
  }
}
$('#wishClose').addEventListener('click', e => {
  e.stopPropagation(); $('#wish').classList.remove('show');
  setTimeout(() => { $$('.candle').forEach(c => c.classList.remove('out')); wished = false; }, 4000);
});

/* ---------- blow into the mic ---------- */
let micStream, micRAF;
$('#micBtn').addEventListener('click', async e => {
  e.stopPropagation();
  if (micStream){ stopMic(); return; }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(micStream).connect(an);
    const data = new Uint8Array(an.fftSize); let loud = 0;
    $('#micBtn').textContent = '🌬️ انفخي هسه!';
    const loop = () => {
      an.getByteTimeDomainData(data);
      let sum = 0; for (const v of data){ const x=(v-128)/128; sum += x*x; }
      const rms = Math.sqrt(sum/data.length);
      loud = rms > .16 ? loud+1 : Math.max(0, loud-1);
      if (loud > 4){ const lit = $$('.candle:not(.out)'); if (lit.length) blowCandle(lit[Math.floor(Math.random()*lit.length)]); loud = 0; }
      micRAF = requestAnimationFrame(loop);
    };
    loop();
  } catch(err){ $('#micBtn').textContent = 'اضغطي على الشموع 🕯️'; }
});
function stopMic(){ cancelAnimationFrame(micRAF); micStream && micStream.getTracks().forEach(t=>t.stop()); micStream = null; $('#micBtn').textContent = '🎤 انفخي'; }

/* ---------- tap hearts everywhere ---------- */
document.addEventListener('pointerdown', e => {
  const h = document.createElement('span'); h.className = 'tap-heart';
  h.textContent = ['💖','💗','🌹','💕','✨'][Math.floor(Math.random()*5)];
  h.style.left = (e.clientX-11)+'px'; h.style.top = (e.clientY-14)+'px';
  h.style.setProperty('--x', rand(-30,30)+'px'); h.style.setProperty('--r', rand(-40,40)+'deg');
  document.body.appendChild(h); setTimeout(()=>h.remove(),1100);
});

/* =========================================================
   FX CANVAS: petals, confetti, fireworks, hearts
   ========================================================= */
const fx = { c: $('#fx'), parts: [], rate: .5 };
fx.ctx = fx.c.getContext('2d');
function resize(){ const d = Math.min(devicePixelRatio||1, 2); fx.c.width = innerWidth*d; fx.c.height = innerHeight*d; fx.ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', resize); resize();
const petalColors = ['#e8194f','#ff5c8a','#c2103f','#ff8fb1','#b3072f','#ffb3c8'];
function petal(x, y, vy){
  fx.parts.push({t:'petal', x: x ?? rand(0,innerWidth), y: y ?? -20, vx: rand(-.6,.6), vy: vy ?? rand(.7,1.8), r: rand(0,6.28), vr: rand(-.04,.04),
    s: rand(6,12), col: petalColors[Math.floor(rand(0,petalColors.length))], ph: rand(0,6.28), life: 1});
}
function petalShower(n, x, y){ for (let i=0;i<n;i++) x!=null ? fx.parts.push({t:'petal',x,y,vx:rand(-4,4),vy:rand(-5,1),r:rand(0,6),vr:rand(-.1,.1),s:rand(6,12),col:petalColors[i%6],ph:rand(0,6),life:1,g:.12}) : petal(rand(0,innerWidth), rand(-200,-10)); }
function confetti(n){
  const cols = ['#ff4f86','#ffd166','#fff','#c8102e','#b48ad8','#7bdff2','#ff9ab6'];
  for (let i=0;i<n;i++) fx.parts.push({t:'conf', x: innerWidth/2 + rand(-80,80), y: innerHeight*.45, vx: rand(-9,9), vy: rand(-13,-4), r: rand(0,6), vr: rand(-.3,.3), w: rand(6,11), h: rand(3,6), col: cols[i%cols.length], life: 1, g:.25});
}
function burst(x, y, n){ for (let i=0;i<n;i++){ const a = rand(0,6.28), sp = rand(2,6); fx.parts.push({t:'heart', x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-1.5, s: rand(7,13), col: petalColors[i%6], life: 1, g:.08, r:0, vr:0}); } }
function heartsRain(n){ for (let i=0;i<n;i++) fx.parts.push({t:'heart', x: rand(0,innerWidth), y: rand(-300,-10), vx: rand(-.5,.5), vy: rand(1.5,3), s: rand(8,15), col: petalColors[i%6], life: 1, g:0, r:0, vr:0}); }
function fireworks(n){
  for (let k=0;k<n;k++) setTimeout(() => {
    const x = rand(innerWidth*.15, innerWidth*.85), y = rand(innerHeight*.12, innerHeight*.5);
    const hue = rand(0,360), cnt = 70;
    for (let i=0;i<cnt;i++){ const a = i/cnt*6.28, sp = rand(2,5.5);
      fx.parts.push({t:'spark', x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, col:`hsl(${hue+rand(-25,25)},100%,${rand(60,75)}%)`, life: 1, g:.05, decay: rand(.012,.02)}); }
  }, k*450);
}
function heartPath(ctx, s){ ctx.beginPath(); ctx.moveTo(0, s*.3); ctx.bezierCurveTo(-s, -s*.4, -s*.5, -s*1.1, 0, -s*.5); ctx.bezierCurveTo(s*.5, -s*1.1, s, -s*.4, 0, s*.3); ctx.fill(); }
let last = performance.now();
function frame(now){
  const dt = Math.min(2.5, (now-last)/16.67); last = now;
  const ctx = fx.ctx; ctx.clearRect(0,0,innerWidth,innerHeight);
  if (Math.random() < fx.rate*dt && fx.parts.length < 400) petal();
  for (let i=fx.parts.length-1; i>=0; i--){
    const p = fx.parts[i];
    p.vy += (p.g||0)*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.t==='petal'){ p.ph += .03*dt; p.x += Math.sin(p.ph)*.8*dt; if (p.g) { p.vx *= .98; if (p.vy > 2) p.vy = 2; } }
    if (p.t==='conf'){ p.vx *= .99; if (p.vy > 4) p.vy = 4; p.life -= .004*dt; }
    if (p.t==='spark'){ p.vx *= .97; p.vy *= .97; p.life -= p.decay*dt; }
    if (p.t==='heart' && p.g){ p.life -= .012*dt; }
    p.r = (p.r||0) + (p.vr||0)*dt;
    if (p.life <= 0 || p.y > innerHeight+40){ fx.parts.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.col;
    if (p.t==='petal'){
      ctx.scale(1, Math.abs(Math.sin(p.ph))*.5+.5);
      ctx.beginPath(); ctx.moveTo(0,-p.s); ctx.bezierCurveTo(p.s*.9,-p.s*.6, p.s*.7,p.s*.8, 0,p.s); ctx.bezierCurveTo(-p.s*.7,p.s*.8, -p.s*.9,-p.s*.6, 0,-p.s); ctx.fill();
      ctx.globalAlpha *= .35; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-p.s*.2,-p.s*.3,p.s*.15,p.s*.4,0,0,6.28); ctx.fill();
    } else if (p.t==='conf'){ ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); }
    else if (p.t==='spark'){ ctx.shadowColor = p.col; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(0,0,2.2,0,6.28); ctx.fill(); }
    else if (p.t==='heart'){ heartPath(ctx, p.s); }
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
